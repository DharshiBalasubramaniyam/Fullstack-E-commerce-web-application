# ─────────────────────────────────────────────────────────────────────────────
# Purely — Local Development Stack
#
# Prerequisites:
#   1. Copy .env.example to .env and fill in SPRING_MAIL_USERNAME / PASSWORD
#   2. docker compose up --build
#
# Service ports (host → container):
#   MongoDB          27017
#   Service Registry 8761   →  http://localhost:8761  (Eureka dashboard)
#   API Gateway      8080
#   Auth Service     9030
#   Category Service 9000
#   Product Service  9010
#   Notification Svc 9020
#   User Service     9050
#   Cart Service     9060
#   Order Service    9070
#   Frontend         80     →  http://localhost
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Service Registry (start first — all other services depend on it) ────────

  service-registry:
    build:
      context: ./microservice-backend/service-registry
    container_name: service-registry
    ports:
      - "8761:8761"
    environment:
      JAVA_OPTS: "-Xmx192m -Xms64m"
    deploy:
      resources:
        limits:
          memory: 384m
    restart: unless-stopped

  # ── API Gateway ─────────────────────────────────────────────────────────────

  api-gateway:
    build:
      context: ./microservice-backend/api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      JAVA_OPTS: "-Xmx192m -Xms64m"
    deploy:
      resources:
        limits:
          memory: 384m
    depends_on:
      - service-registry
    restart: unless-stopped

  # ── Auth Service ─────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ./microservice-backend/auth-service
    container_name: auth-service
    ports:
      - "9030:9030"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/purely_auth_service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: auth-service
      JAVA_OPTS: "-Xmx192m -Xms64m"
    deploy:
      resources:
        limits:
          memory: 384m
    depends_on:
      mongodb:
        condition: service_healthy
      service-registry:
        condition: service_started
    restart: unless-stopped

  # ── User Service ─────────────────────────────────────────────────────────────

  user-service:
    build:
      context: ./microservice-backend/user-service
    container_name: user-service
    ports:
      - "9050:9050"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/purely_user_service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: user-service
      JAVA_OPTS: "-Xmx192m -Xms64m"
    deploy:
      resources:
        limits:
          memory: 384m
    depends_on:
      mongodb:
        condition: service_healthy
      service-registry:
        condition: service_started
    restart: unless-stopped

  # ── Category Service ──────────────────────────────────────────────────────────

  category-service:
    build:
      context: ./microservice-backend/category-service
    container_name: category-service
    ports:
      - "9000:9000"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/purely_category_service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: category-service
      JAVA_OPTS: "-Xmx192m -Xms64m"
    deploy:
      resources:
        limits:
          memory: 384m
    depends_on:
      mongodb:
        condition: service_healthy
      service-registry:
        condition: service_started
    restart: unless-stopped

  # ── Product Service ───────────────────────────────────────────────────────────

  product-service:
    build:
      context: ./microservice-backend/product-service
    container_name: product-service
    ports:
      - "9010:9010"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/purely_product_service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: product-service
      JAVA_OPTS: "-Xmx192m -Xms64m"
    deploy:
      resources:
        limits:
          memory: 384m
    depends_on:
      mongodb:
        condition: service_healthy
      service-registry:
        condition: service_started
    restart: unless-stopped

  # ── Cart Service ──────────────────────────────────────────────────────────────

  cart-service:
    build:
      context: ./microservice-backend/cart-service
    container_name: cart-service
    ports:
      - "9060:9060"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/purely_cart_service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: cart-service
      JAVA_OPTS: "-Xmx192m -Xms64m"
    deploy:
      resources:
        limits:
          memory: 384m
    depends_on:
      mongodb:
        condition: service_healthy
      service-registry:
        condition: service_started
    restart: unless-stopped

  # ── Order Service ─────────────────────────────────────────────────────────────

  order-service:
    build:
      context: ./microservice-backend/order-service
    container_name: order-service
    ports:
      - "9070:9070"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/purely_order_service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: order-service
      JAVA_OPTS: "-Xmx192m -Xms64m"
    deploy:
      resources:
        limits:
          memory: 384m
    depends_on:
      mongodb:
        condition: service_healthy
      service-registry:
        condition: service_started
    restart: unless-stopped

  # ── Notification Service ──────────────────────────────────────────────────────

  notification-service:
    build:
      context: ./microservice-backend/notification-service
    container_name: notification-service
    ports:
      - "9020:9020"
    environment:
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: notification-service
      JAVA_OPTS: "-Xmx192m -Xms64m"
    deploy:
      resources:
        limits:
          memory: 384m
    depends_on:
      - service-registry
    restart: unless-stopped

  # ── Frontend ──────────────────────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    volumes:
      # Override nginx config to proxy /api → api-gateway for local dev
      - ./docker/nginx-dev.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          memory: 128m
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  mongo-data:
