# nginx config for local Docker Compose development.
# Proxies /api/* → api-gateway container so the React frontend works without changes.
# This file is volume-mounted over the container's default nginx config.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all API calls to the api-gateway container
    location /api/ {
        proxy_pass         http://api-gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Serve React SPA — redirect all other routes to index.html
    location / {
        try_files $uri /index.html;
    }
}
